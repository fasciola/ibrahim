<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none" role="img" aria-label="Ibrahim Setup – UAE Business Setup Expert">
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#C5A069" stroke-width="0.5" opacity="0.06"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#C5A069" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#071A2B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#071A2B"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#C5A069" stroke-width="1" opacity="0.25" rx="8"/>

  <g transform="translate(600, 250)">
    <circle cx="-130" cy="0" r="72" fill="#0D2438"/>
    <circle cx="-130" cy="0" r="70" fill="none" stroke="#C5A069" stroke-width="1.5" opacity="0.45"/>
    <text x="-130" y="4" text-anchor="middle" dominant-baseline="central" font-family="'Arial Black', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="56" font-weight="900" fill="#C5A069" letter-spacing="-2">IS</text>
    <text x="-30" y="-12" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#F8F5F0" letter-spacing="1">IBRAHIM SETUP</text>
    <text x="-30" y="24" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#C5A069" letter-spacing="4">UAE BUSINESS SETUP EXPERT</text>
  </g>

  <line x1="400" y1="400" x2="800" y2="400" stroke="#C5A069" stroke-width="1" opacity="0.4"/>

  <text x="600" y="460" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="500" fill="#E8D5B0" letter-spacing="0.5">Your Business. Our Expertise. Your Success.</text>

  <text x="600" y="540" text-anchor="middle" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#C5A069" letter-spacing="3" opacity="0.7">ibrahimsetup.com</text>
</svg>
